<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #4CBB17;
  }
  .container {
    text-align: center;
    padding: 60px;
  }
  .logo {
    font-size: 72px;
    font-weight: 900;
    color: #0F2406;
    letter-spacing: 4px;
    margin-bottom: 8px;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .logo span {
    color: #4CBB17;
  }
  .tagline {
    font-size: 28px;
    color: #6B9E5A;
    margin-bottom: 40px;
  }
  .feature {
    font-size: 22px;
    color: #1A3D0A;
    margin: 12px 0;
  }
  .badge {
    display: inline-block;
    background: #4CBB17;
    color: white;
    padding: 12px 32px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 700;
    margin-top: 32px;
    letter-spacing: 1px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="logo">MORA <span>BETS</span></div>
  <div class="tagline">Free daily picks · Real math</div>
  <div class="feature">✓ No-vig true probability</div>
  <div class="feature">✓ MLB &amp; NHL picks updated daily</div>
  <div class="feature">✓ Best line across FanDuel, DraftKings, BetMGM</div>
  <div class="badge">morabets.com — Free Forever</div>
</div>
</body>
</html>
