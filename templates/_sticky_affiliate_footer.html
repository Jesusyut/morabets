<script>
(function () {
  var root = document.getElementById('saf-root');
  root.style.display = 'flex';
  document.body.classList.add('saf-visible');

  /* ── Variant rotation ── */
  var current = 0;
  var variants = document.querySelectorAll('.bovada-variant');
  if (variants.length >= 2) {
    setInterval(function () {
      variants[current].style.opacity = '0';
      current = (current + 1) % variants.length;
      setTimeout(function () {
        variants[current].style.opacity = '1';
      }, 300);
    }, 8000);
  }

})();
</script>
