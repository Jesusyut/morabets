<script>
(function () {
  var STORAGE_KEY = 'mora_saf_dismissed';
  var root = document.getElementById('saf-root');
  var dismiss = document.getElementById('saf-dismiss');

  if (localStorage.getItem(STORAGE_KEY) === '1') return;

  root.style.display = 'flex';
  document.body.classList.add('saf-visible');

  /* ── Variant rotation ── */
  var current = 0;
  var variants = document.querySelectorAll('.bovada-variant');
  if (variants.length >= 2) {
    setInterval(function () {
      variants[current].style.opacity = '0';
      current = (current + 1) % variants.length;
      setTimeout(function () {
        variants[current].style.opacity = '1';
      }, 300);
    }, 8000);
  }

  /* ── Dismiss ── */
  dismiss.addEventListener('click', function (e) {
    e.stopPropagation();
    root.style.opacity = '0';
    setTimeout(function () {
      root.style.display = 'none';
      document.body.classList.remove('saf-visible');
    }, 300);
    try { localStorage.setItem(STORAGE_KEY, '1'); } catch (_) {}
  });

})();
</script>
