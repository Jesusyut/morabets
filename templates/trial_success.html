<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Day Trial | Fade the Books</title>
  <link rel="icon" href="/static/fade-the-books-icon.svg" type="image/svg+xml">
  {% if meta_pixel_id %}
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ meta_pixel_id }}');
    fbq('track', 'PageView');
  </script>
  {% endif %}
  <style>
    :root {
      --green: #22c55e;
      --bg: #050905;
      --panel: #101711;
      --text: #f4fff6;
      --muted: #aab7ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.16), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 540px);
      padding: 34px;
      border: 1px solid rgba(34, 197, 94, 0.34);
      border-radius: 18px;
      background: rgba(16, 23, 17, 0.94);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.5), 0 0 44px rgba(34, 197, 94, 0.1);
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-top: 28px;
      border-radius: 10px;
      background: var(--green);
      color: #031006;
      font-weight: 950;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 18px 44px rgba(34, 197, 94, 0.24);
    }
    .tiny {
      margin-top: 12px;
      color: #7f8d83;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Fade the Books</p>
    <h1>Your free trial path is ready.</h1>
    <p>You're on the free tips list. Start the trial when you're ready to test the daily no-vig dashboard across active sports.</p>
    <a class="button" href="{{ trial_link }}">Start Free Trial</a>
    <p class="tiny">Then $44.99/month. Cancel anytime.</p>
  </main>
</body>
</html>
